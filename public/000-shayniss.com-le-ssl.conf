<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName shayniss.com
    ServerAlias www.shayniss.com

    DocumentRoot /var/www/html/shayniss

    <Directory /var/www/html/shayniss>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/shayniss-error.log
    CustomLog ${APACHE_LOG_DIR}/shayniss-access.log combined
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/shayniss.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/shayniss.com/privkey.pem
</VirtualHost>
</IfModule>
