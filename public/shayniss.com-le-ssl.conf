<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName api.agbolaw.com
        define domaine_name api.agbolaw.com

#	ServerAlias www.api.agbofy.com
        ProxyRequests Off

	define apps_ip 127.0.0.1:8096

        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule /(.*) ws://${apps_ip}/$1 [P,L]
        RewriteCond %{HTTP:Upgrade} !=websocket [NC]
        RewriteRule /(.*) http://${apps_ip}/$1 [P,L]
        ProxyPass / http://${apps_ip}/
        ProxyPass / ws://${apps_ip}/
        ProxyPassReverse / http://${apps_ip}/
        ProxyRequests Off


SSLCertificateFile /etc/letsencrypt/live/api.agbolaw.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.agbolaw.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
